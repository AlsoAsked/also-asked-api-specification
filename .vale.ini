StylesPath = vale
MinAlertLevel = suggestion

Vocab = AlsoAsked

# Guide pages: Google developer documentation style, plus the AlsoAsked termbase and LLM-reader rules.
[docs/*.md]
BasedOnStyles = Vale, Google, AlsoAsked

# OpenAPI source: the description, title and summary fields (vale/config/views/OpenAPI.yml).
# Files with a list at the top level (src/enums) have no prose and are not linted.
[src/{openapi.yaml,components/**/*.yaml,paths/**/*.yaml,webhooks/*.yaml,tags/*.yaml,servers/*.yaml,examples/**/*.yaml}]
BasedOnStyles = Vale, Google, AlsoAsked
View = OpenAPI
