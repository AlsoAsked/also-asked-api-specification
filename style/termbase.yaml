# AlsoAsked termbase: one approved term for each concept.
#
# This file is the source for the Vale vocabulary, the Vale term rules and the glossary page.
# Do not edit the generated files. Edit this file, then run `npm run style`.
#
# Entry keys:
#   term:       the approved term, as it appears in a sentence.
#   pos:        part of speech of the approved term (noun, verb, adjective).
#   definition: one sentence. It must be correct without the rest of the docs.
#   matches:    the fixed names in the API or the app that this term must agree with.
#   reject:     words that must not be used for this concept.
#     phrase:   a regular expression (case-insensitive) for the rejected words.
#     level:    error = Vale blocks the commit. review = the word is correct in another sense,
#               so a reviewer checks it. Review entries do not make Vale rules.
#     use:      the replacement to show in the Vale message.
#   example:    a correct sentence.
#   status:     draft = waiting for team confirmation. approved = confirmed.

terms:
  # --- Searches and results ---------------------------------------------------

  - term: search
    pos: noun
    definition: >-
      A set of 1 or more terms that you send to the AlsoAsked API in one request. Each search has an ID, a status,
      and a depth.
    matches:
      - "endpoint: POST /v1.1/search, GET /v1.1/search/{searchId}"
      - "path parameter: searchId"
      - "webhook events: search_created, search_started, search_succeeded, search_failed"
      - "schema: SearchRequest (identifier only, not prose)"
    reject:
      - phrase: 'search requests?'
        level: error
        use: search
      - phrase: 'search jobs?'
        level: error
        use: search
    example: The search has 3 terms and a depth of 2.
    status: approved

  - term: term
    pos: noun
    definition: A question or phrase that AlsoAsked searches for. A search has 1 to 1,000 terms.
    matches:
      - "field: terms, term"
    reject:
      - phrase: 'search terms?'
        level: error
        use: term
      - phrase: 'keywords?'
        level: error
        use: term
      - phrase: '(?:search )?quer(?:y|ies)'
        level: review
        use: term (if you mean the text that AlsoAsked searches for)
    example: Put each term in the `terms` field.
    status: approved

  - term: query
    pos: noun
    definition: >-
      One item in the `queries` field of a search. A query contains one term and the results for that term.
    matches:
      - "field: queries"
      - "schema: SearchQuery (identifier only)"
    reject: []
    example: The `queries` field contains one query for each term in the search.
    status: approved

  - term: result
    pos: noun
    definition: One question that Google shows for a term. A result has an answer and can have child results.
    matches:
      - "field: results"
      - "schema: SearchResult (identifier only)"
    reject:
      - phrase: 'question and answers?'
        level: review
        use: result
    example: Each result has a `question` field and an `answer_excerpt` field.
    status: approved

  - term: top-level result
    pos: noun
    definition: A result that isn't inside another result. Its `position` field has one number.
    matches:
      - "field: position (one item)"
    reject:
      - phrase: 'root (?:questions?|results?)'
        level: error
        use: top-level result
      - phrase: 'parent questions?'
        level: error
        use: top-level result, or parent result
    example: A search with a depth of 1 gets only top-level results.
    status: approved

  - term: child result
    pos: noun
    definition: A result inside another result. The result that contains it is its parent result.
    matches:
      - "field: results (inside a result)"
    reject:
      - phrase: 'sub-?questions?'
        level: error
        use: child result
      - phrase: 'sub-?results?'
        level: error
        use: child result
      - phrase: 'nested questions?'
        level: error
        use: child result
    example: The `results` field of a result contains its child results.
    status: approved

  - term: depth
    pos: noun
    definition: The number of levels of results that a search gets. The value is 1, 2, or 3.
    matches:
      - "field: depth"
    reject:
      - phrase: 'deep search'
        level: review
        use: a search with a depth of 3
    example: Set the `depth` field to `3` to get 3 levels of results.
    status: approved

  - term: status
    pos: noun
    definition: >-
      The stage of a search or of one of its terms: `queueing`, `pending`, `running`, `fetching`, `error`, `no_results`,
      or `success`.
    matches:
      - "field: status"
      - "enum: SearchRequestStatus"
    reject:
      - phrase: 'state'
        level: review
        use: status
    example: When the status of a query is `success`, the `results` field of the query contains the results.
    status: approved

  - term: synchronous search
    pos: noun
    definition: >-
      A search where the API sends the response only when the search is complete, or after 90 seconds. The `async`
      field is `false`.
    matches:
      - "field: async = false"
    reject:
      - phrase: 'blocking (?:search|request|mode)'
        level: error
        use: synchronous search
    example: A synchronous search returns the results in the response body.
    status: approved

  - term: asynchronous search
    pos: noun
    definition: >-
      A search where the API sends the response immediately, before the search is complete. The `async` field is
      `true`.
    matches:
      - "field: async = true"
    reject:
      - phrase: 'non-blocking (?:search|request|mode)'
        level: error
        use: asynchronous search
      - phrase: 'fire[- ]and[- ]forget'
        level: error
        use: asynchronous search
      - phrase: 'background search'
        level: error
        use: asynchronous search
    example: An asynchronous search returns the search ID immediately.
    status: approved

  - term: stored result
    pos: noun
    definition: >-
      A result that AlsoAsked stored for an earlier search by any account, and uses again instead of getting new results
      from Google. On the live API, a term with stored results costs no credits. Set `fresh` to `true` to get new
      results.
    matches:
      - "fields: cached, cached_at, fresh"
    reject:
      - phrase: 'cached results?'
        level: review
        use: stored result
    example: Set `fresh` to `true` if you don't want stored results.
    status: approved

  - term: search history
    pos: noun
    definition: >-
      The searches that you can list, get, and delete with the AlsoAsked API. On the live API, the history limit of
      your plan sets how old a search in it can be.
    matches:
      - "endpoints: GET /v1.1/search, GET /v1.1/search/{searchId}, DELETE /v1.1/search/{searchId}"
    reject: []
    example: A deleted search stays in your search history.
    status: draft

  - term: AI overview
    pos: noun
    definition: An answer that Google generates from more than one web page.
    matches:
      - "fields: ai_overview, ai_overview_hrefs, ai_overview_page_titles"
    reject:
      - phrase: 'AI summary'
        level: error
        use: AI overview
      - phrase: 'SGE'
        level: error
        use: AI overview
    example: If `ai_overview` is `true`, the answer is an AI overview.
    status: approved

  - term: language code
    pos: noun
    definition: The code of the language for a search, for example `en`.
    matches:
      - "field: language"
      - "enum: Language"
    reject: []
    example: The default language code is `en`.
    status: approved

  - term: region code
    pos: noun
    definition: The two-letter ISO 3166-1 code of the country for a search, for example `us`.
    matches:
      - "field: region"
      - "enum: Region"
    reject:
      - phrase: 'country code'
        level: review
        use: region code
    example: The default region code is `us`.
    status: approved

  - term: search object
    pos: noun
    definition: >-
      The JSON object that describes one search in a response body or in the body of a webhook event, with fields
      such as `id`, `status`, and `queries`.
    matches:
      - "schema: SearchRequest, SearchRequestResults"
    reject: []
    example: The response body of the `GET /v1.1/search/{searchId}` endpoint is the search object.
    status: draft

  - term: history limit
    pos: noun
    definition: How old a search in your search history can be. Your plan sets the history limit.
    matches: []
    reject: []
    example: For a Pro plan, the history limit is 1 year.
    status: draft

  # --- HTTP and the API -------------------------------------------------------

  - term: error type
    pos: noun
    definition: The value of the `status` field in an error response body, for example `insufficient_credits`.
    matches:
      - "schema: ErrorType"
    reject: []
    example: The API returns the status code `404 Not Found` with the error type `not_found`.
    status: draft

  - term: AlsoAsked API
    pos: noun
    definition: The HTTP API that you use to perform searches and get results.
    matches:
      - "hosts: alsoaskedapi.com, sandbox.alsoaskedapi.com"
    reject:
      - phrase: "AlsoAsked's API"
        level: error
        use: the AlsoAsked API
    example: The AlsoAsked API accepts JSON request bodies.
    status: approved

  - term: endpoint
    pos: noun
    definition: One HTTP method and path of the AlsoAsked API, for example `POST /v1.1/search`.
    matches: []
    reject:
      - phrase: 'routes?'
        level: review
        use: endpoint
      - phrase: 'API calls?'
        level: review
        use: request
    example: Send the request to the `GET /v1.1/account` endpoint.
    status: approved

  - term: request
    pos: noun
    definition: An HTTP message that you send to an endpoint.
    matches: []
    reject: []
    example: Each request must include the `X-Api-Key` header.
    status: approved

  - term: response
    pos: noun
    definition: The HTTP message that the AlsoAsked API returns for a request.
    matches: []
    reject: []
    example: The response has the status code `200 OK`.
    status: approved

  - term: field
    pos: noun
    definition: >-
      A name and value in a JSON object, for example `"depth": 2`.
    matches:
      - "OpenAPI: properties"
    reject:
      - phrase: 'propert(?:y|ies)'
        level: error
        use: field
      - phrase: 'attributes?'
        level: error
        use: field
      - phrase: 'flags?'
        level: error
        use: field (for example, "the `async` field")
      - phrase: 'options?'
        level: review
        use: field
    example: Set the `depth` field to `3`.
    status: approved

  - term: parameter
    pos: noun
    definition: A value in the path or the query string of a request URL.
    matches:
      - "path parameter: searchId"
      - "query parameters: page, count, results_format"
    reject: []
    example: Use the `page` query parameter to get the next page.
    status: approved

  - term: header
    pos: noun
    definition: A name and value in the HTTP headers of a request or response.
    matches: []
    reject: []
    example: Put your API key in the `X-Api-Key` header.
    status: approved

  - term: body
    pos: noun
    definition: The JSON content of a request or response.
    matches: []
    reject:
      - phrase: 'payloads?'
        level: error
        use: body
    example: The response body contains the search.
    status: approved

  - term: status code
    pos: noun
    definition: The three-digit number in an HTTP response that shows the result of the request, for example `429`.
    matches: []
    reject:
      - phrase: '(?:HTTP|response) codes?'
        level: error
        use: status code
    example: The status code `429` tells you that you sent too many requests.
    status: approved

  # --- Account, keys and environments -----------------------------------------

  - term: API key
    pos: noun
    definition: >-
      The secret value that identifies your account in each request. It starts with `aa-live-` or `aa-sandbox-`.
    matches:
      - "UI: API keys page"
      - "header: X-Api-Key"
    reject:
      - phrase: '(?:access|API|auth|bearer) tokens?'
        level: error
        use: API key
    example: Create an API key on the API keys page.
    status: approved

  - term: live API
    pos: noun
    definition: The AlsoAsked API that gets real results from Google and uses credits. Its host is `alsoaskedapi.com`.
    matches:
      - "enum: Environment = live"
      - "error message: 'the live API'"
    reject:
      - phrase: 'production (?:API|environment)'
        level: error
        use: live API
    example: You need a Pro plan to use the live API.
    status: approved

  - term: sandbox API
    pos: noun
    definition: >-
      The AlsoAsked API for testing. It returns test results and uses separate sandbox credits, not the credits of
      your plan. Its host is `sandbox.alsoaskedapi.com`.
    matches:
      - "enum: Environment = sandbox"
    reject:
      - phrase: '(?:test|staging) (?:API|environment)'
        level: error
        use: sandbox API
    example: Use the sandbox API while you develop your integration.
    status: approved

  - term: test term
    pos: noun
    definition: >-
      A term that makes the sandbox API behave in a known way, for example `[error]` or `[delay 2]`.
    matches:
      - "sandbox terms: [error], [no_results], [timeout], [server_error], [rate_limit], [delay N]"
    reject: []
    example: Add the test term `[error]` to test a term that fails.
    status: draft

  - term: account
    pos: noun
    definition: Your AlsoAsked account. The API keys, credits, and plan belong to it.
    matches:
      - "endpoint: GET /v1.1/account"
    reject:
      - phrase: 'customers?'
        level: review
        use: account, or you
      - phrase: 'users?'
        level: review
        use: account, or you
    example: The response contains the credits in your account.
    status: approved

  - term: plan
    pos: noun
    definition: The AlsoAsked subscription level of an account, for example Pro.
    matches:
      - "field: plan_type"
      - "error message: 'Pro plan'"
    reject:
      - phrase: 'subscriptions?'
        level: review
        use: plan
      - phrase: 'tiers?'
        level: error
        use: plan
    example: You need a Pro plan to use the live API.
    status: approved

  - term: team owner
    pos: noun
    definition: >-
      The account that owns a team. The team members use the plan and the credits of the team owner.
    matches:
      - "UI: Team"
    reject: []
    example: The team owner sees all the searches of the team.
    status: draft

  - term: credit
    pos: noun
    definition: >-
      The unit that AlsoAsked uses to charge for searches. A search costs credits for each term. The cost depends on
      the depth.
    matches:
      - "fields: credits, web_credits, api_credits, credits_reset_at"
      - "header: X-AlsoAsked-Credits"
    reject: []
    example: The cost of a search depends on the number of terms and the depth.
    status: approved

  - term: plan credits
    pos: noun
    definition: >-
      The credits that come with your plan. They renew on the date in the `credits_reset_at` field. The `web_credits`
      field has them.
    matches:
      - "field: web_credits"
      - "UI: account credits"
    reject:
      - phrase: 'web credits?'
        level: error
        use: plan credits
    example: AlsoAsked uses your plan credits before your pay-as-you-go credits.
    status: draft

  - term: pay-as-you-go credits
    pos: noun
    definition: >-
      The credits that you buy in addition to your plan. They don't renew, and only a Pro plan can use them. The
      `api_credits` field has them.
    matches:
      - "field: api_credits"
      - "UI: Pay-as-you-go credits page"
    reject:
      - phrase: 'API credits?'
        level: error
        use: pay-as-you-go credits
    example: Automatic top-up buys pay-as-you-go credits when your credits fall below 100.
    status: draft

  - term: sandbox credits
    pos: noun
    definition: >-
      The credits that the sandbox API uses. Each account has 1,000 sandbox credits, which reset 24 hours after the last
      reset.
    matches:
      - "header on the sandbox API: X-AlsoAsked-Credits"
    reject: []
    example: A sandbox search costs sandbox credits, not the credits of your plan.
    status: draft

  - term: rate limit
    pos: noun
    definition: The maximum number of requests that you can send in a time window.
    matches:
      - "headers: X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset, Retry-After"
    reject:
      - phrase: 'throttl(?:e|ed|es|ing)'
        level: error
        use: rate limit
    example: If you send more requests than the rate limit allows, the API returns the status code `429`.
    status: approved

  - term: webhook request
    pos: noun
    definition: The HTTP `POST` request that carries one webhook event to a webhook endpoint.
    matches:
      - "webhook: searchStatusChanged"
    reject: []
    example: Each webhook request has a signature in the `X-AlsoAsked-Signature` header.
    status: draft

  - term: team administrator
    pos: noun
    definition: >-
      A team member that the team owner gave the administrator role. A team administrator sees the searches of the
      team members, but not the searches of the team owner.
    matches:
      - "UI: Team"
    reject: []
    example: A team administrator sees the searches of the team members.
    status: draft

  # --- Webhooks ---------------------------------------------------------------

  - term: webhook endpoint
    pos: noun
    definition: A URL on your server that receives webhook events from AlsoAsked.
    matches:
      - "UI: Webhooks page, Webhook endpoints section"
    reject:
      - phrase: 'callbacks?(?: URLs?)?'
        level: error
        use: webhook endpoint
      - phrase: 'webhook URLs?'
        level: error
        use: webhook endpoint
    example: Add a webhook endpoint on the Webhooks page.
    status: approved

  - term: webhook event
    pos: noun
    definition: >-
      A request that AlsoAsked sends to your webhook endpoints when the status of a search changes, for example
      `search_succeeded`.
    matches:
      - "enum: WebhookEventType"
      - "header: X-AlsoAsked-Webhook-Event"
    reject:
      - phrase: 'notifications?'
        level: review
        use: webhook event
    example: AlsoAsked sends a `search_started` webhook event when the search starts.
    status: approved

  - term: webhook signing key
    pos: noun
    definition: The secret value that AlsoAsked uses to make the signature of each webhook event.
    matches:
      - "header: X-AlsoAsked-Signature"
    reject:
      - phrase: '(?:signing|webhook|shared) secrets?'
        level: error
        use: webhook signing key
    example: Use your webhook signing key to verify the signature.
    status: approved

  - term: signature
    pos: noun
    definition: The value in the `X-AlsoAsked-Signature` header that shows that AlsoAsked sent the webhook event.
    matches:
      - "header: X-AlsoAsked-Signature"
    reject: []
    example: Verify the signature before you use the body.
    status: approved

  # --- Verbs ------------------------------------------------------------------

  - term: perform
    pos: verb
    definition: To start a new search with the `POST /v1.1/search` endpoint.
    matches:
      - "operation: performSearch"
      - "PHP client: performSearch()"
    reject:
      - phrase: '(?:conduct|execute|run|do|make)(?:s|ed|ing)? (?:a |the |an |your )?(?:a?synchronous )?search(?:es)?'
        level: error
        use: perform a search
      - phrase: 'creat(?:e|es|ed|ing) (?:a |the |an |your )?(?:a?synchronous )?search(?:es)?'
        level: review
        use: perform a search (for the reader's action). "AlsoAsked creates the search" is correct.
    example: Perform a search with the terms that you want results for.
    status: approved

  - term: get
    pos: verb
    definition: To read data from the AlsoAsked API with a `GET` request.
    matches: []
    reject:
      - phrase: 'retriev(?:e|es|ed|ing)'
        level: error
        use: get
      - phrase: 'fetch(?:es|ed|ing)?'
        level: review
        use: get (but `fetching` is a status value)
    example: Get the search with the `GET /v1.1/search/{searchId}` endpoint.
    status: approved

  - term: send
    pos: verb
    definition: To transmit a request to the AlsoAsked API, or a webhook event to a webhook endpoint.
    matches: []
    reject:
      - phrase: 'make (?:a |an )?(?:API )?requests?'
        level: error
        use: send a request
      - phrase: '(?:issue|submit)(?:s|ted|ting)? (?:a |the )?requests?'
        level: error
        use: send a request
    example: Send a request to the `GET /v1.1/account` endpoint.
    status: approved

  - term: return
    pos: verb
    definition: To give a response to a request. The AlsoAsked API returns a response.
    matches: []
    reject:
      - phrase: '(?:respond|reply|replies|replied) with'
        level: error
        use: return
    example: The API returns the status code `404` if the search doesn't exist.
    status: approved

  - term: verify
    pos: verb
    definition: To make sure that a signature is correct.
    matches: []
    reject:
      - phrase: 'validat(?:e|es|ed|ing) (?:the |a )?signatures?'
        level: error
        use: verify the signature
      - phrase: 'check(?:s|ed|ing)? (?:the |a )?signatures?'
        level: error
        use: verify the signature
    example: Verify the signature of each webhook event.
    status: approved

  - term: delete
    pos: verb
    definition: To remove access to a search and its results with the `DELETE /v1.1/search/{searchId}` endpoint.
    matches: []
    reject:
      - phrase: 'remov(?:e|es|ed|ing) (?:a |the )?search(?:es)?'
        level: error
        use: delete the search
    example: Delete the search when you don't need it.
    status: approved
