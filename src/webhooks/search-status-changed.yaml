operationId: searchStatusChanged
tags:
  - Webhooks
summary: Search status changed
description: |
  The request that AlsoAsked sends to your webhook endpoint when the status of a search changes. Your server receives
  this request. It isn't an endpoint of the AlsoAsked API.

  AlsoAsked sends a `POST` request with a JSON body to the URL of your webhook endpoint. The body has the ID of the
  webhook event in the `event_id` field, followed by the fields of the `GET /v1.1/search/{searchId}` response for the
  search, at the time when AlsoAsked sends the request. The results are in the `tree` results format. The headers
  contain the webhook event type, the environment, and a signature that you use to verify the request.

  For details, see [Webhooks](../docs/webhooks.md) and
  [Verify webhook signatures](../docs/verify-webhook-signatures.md).
parameters:
  - $ref: ../components/parameters/webhooks/X-AlsoAsked-Credits.yaml
  - $ref: ../components/parameters/webhooks/X-AlsoAsked-Api-Version.yaml
  - $ref: ../components/parameters/webhooks/X-AlsoAsked-Signature.yaml
  - $ref: ../components/parameters/webhooks/X-AlsoAsked-Timestamp.yaml
  - $ref: ../components/parameters/webhooks/X-AlsoAsked-Webhook-Event.yaml
  - $ref: ../components/parameters/webhooks/X-AlsoAsked-Environment.yaml
requestBody:
  $ref: ../components/requestBodies/search/StatusChangedWebhook.yaml
responses:
  '2XX':
    description: |
      Your webhook endpoint received the webhook event. AlsoAsked doesn't try again to send the webhook event. Keep
      the response body smaller than 1 MB: with a larger response body, AlsoAsked counts the attempt as failed. In rare
      cases, your webhook endpoint can still receive the same webhook event twice, so ignore a webhook event whose
      `event_id` field you already processed.
  '3XX':
    description: |
      AlsoAsked doesn't follow redirects, so AlsoAsked counts the attempt as failed and sends the webhook event again
      later, up to 10 attempts in total. Use the final URL of your webhook endpoint.
  '4XX':
    description: |
      AlsoAsked counts the attempt as failed and sends the webhook event again later, up to 10 attempts in total.
  '5XX':
    description: |
      AlsoAsked counts the attempt as failed and sends the webhook event again later, up to 10 attempts in total.
