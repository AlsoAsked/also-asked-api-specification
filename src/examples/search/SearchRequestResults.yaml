      - question: How to grow broad beans in a greenhouse?
        position: [1, 1, 3]
        answer_excerpt: >-
          Sow broad beans in deep pots in a cool greenhouse from late winter. Keep the greenhouse well
          ventilated, as broad beans don't like heat, and plant them out when the weather warms up in spring.
        answer_href: https://www.plantprodigest.com/edibles/beans/growing-broad-beans-under-glass
        answer_page_title: Growing broad beans under glass - PlantPro Digest
