      - question: Do you get a second crop of broad beans?
        position: [1, 1, 1]
        answer_excerpt: >-
          Cut the plants down to about 5 cm above the ground after the first harvest. The stumps often send
          up new shoots that give a smaller second crop later in the summer.
        answer_href: https://www.greenthumbacademy.net/bean-care/broad-bean-second-crop
        answer_page_title: Getting a second crop from broad beans - GreenThumb Academy
