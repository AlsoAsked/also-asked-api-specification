      - question: What not to plant with broad beans?
        position: [1, 1, 2]
        answer_excerpt: >-
          Don't plant broad beans next to onions, garlic, leeks or other alliums. Alliums can slow the
          growth of beans and other legumes.
        answer_href: https://www.urbanvegally.com/articles/beans/broad-bean-companion-plants
        answer_page_title: Broad bean companion plants - UrbanVeg Ally
