operationId: getAccount
tags:
  - Account
summary: Get account details
description: |
  Get the details of the account that owns the API key in the `X-Api-Key` header, including its plan type and its
  credits.

  On the sandbox API, the `credits` and `web_credits` fields show the sandbox credits, and the `api_credits` field is
  `0`.
security:
  - apiKey: []
responses:
  '200':
    $ref: ../../components/responses/account/GetAccount.yaml
  '401':
    $ref: ../../components/responses/errors/UnauthorizedError.yaml
  '402':
    $ref: ../../components/responses/errors/InsufficientPlanError.yaml
  '403':
    $ref: ../../components/responses/errors/ForbiddenError.yaml
  '429':
    $ref: ../../components/responses/errors/RateLimitExceededError.yaml
  '500':
    $ref: ../../components/responses/errors/InternalServerError.yaml
