operationId: searchWebhookExample
tags:
  - Search
summary: Example webhook event request
description: |
  This operation isn't an endpoint of the AlsoAsked API, and the `/search/webhook-example` path doesn't exist. The
  operation describes the request that AlsoAsked sends to your webhook endpoint when the status of a search changes.

  AlsoAsked sends a `POST` request with a JSON body to the URL of your webhook endpoint. The body is the same as the
  `GET /v1.1/search/{searchId}` response for the search, at the time when AlsoAsked sends the request. The headers
  contain the webhook event type, the environment, and a signature that you use to verify the request.

  For details, see [Webhooks](../docs/webhooks.md) and
  [Verify webhook signatures](../docs/verify-webhook-signatures.md).
parameters:
  - $ref: ../../components/parameters/webhooks/X-AlsoAsked-Credits.yaml
  - $ref: ../../components/parameters/webhooks/X-AlsoAsked-Api-Version.yaml
  - $ref: ../../components/parameters/webhooks/X-AlsoAsked-Signature.yaml
  - $ref: ../../components/parameters/webhooks/X-AlsoAsked-Timestamp.yaml
  - $ref: ../../components/parameters/webhooks/X-AlsoAsked-Webhook-Event.yaml
  - $ref: ../../components/parameters/webhooks/X-AlsoAsked-Environment.yaml
requestBody:
  $ref: ../../components/requestBodies/search/StatusChangedWebhook.yaml
responses:
  '200':
    description: |
      Your webhook endpoint received the webhook event. AlsoAsked counts a status code below `400` as delivered.
  '204':
    description: |
      Your webhook endpoint received the webhook event. AlsoAsked counts a status code below `400` as delivered.
