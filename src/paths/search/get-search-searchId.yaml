operationId: getSearch
tags:
  - Search
summary: Get a search
description: |
  Get a search by its ID. The response includes the status and the results of the search.

  The `queries` field contains one query for each term only when the `status` field is `success`. Otherwise, the
  `queries` field is `null`.

  The `results_format` query parameter sets how the API returns the results: `tree` (default) puts child results inside
  their parent result, and `flat` returns all results in one list.

  You can get only searches in your search history. For a search that isn't in your search history, the API returns
  `404 Not Found`.
security:
  - apiKey: []
parameters:
  - $ref: ../../components/parameters/search/searchId.yaml
  - $ref: ../../components/parameters/search/resultsFormat.yaml
responses:
  '200':
    $ref: ../../components/responses/search/GetSearch.yaml
  '401':
    $ref: ../../components/responses/errors/UnauthorizedError.yaml
  '402':
    $ref: ../../components/responses/errors/InsufficientPlanError.yaml
  '403':
    $ref: ../../components/responses/errors/ForbiddenError.yaml
  '404':
    $ref: ../../components/responses/errors/NotFoundError.yaml
  '422':
    $ref: ../../components/responses/errors/ValidationError.yaml
  '429':
    $ref: ../../components/responses/errors/RateLimitExceededError.yaml
  '500':
    $ref: ../../components/responses/errors/InternalServerError.yaml
