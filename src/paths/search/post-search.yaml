operationId: performSearch
tags:
  - Search
summary: Perform a search
description: |
  Perform a search for 1 or more terms. AlsoAsked charges the credits for the search when it creates the search.

  The `async` field in the request body sets how the API returns the response:

  - `false` (default): a synchronous search. The API waits until the search is complete, for a maximum of 90 seconds,
    and then returns the response. If the search isn't complete after 90 seconds, it keeps running.
  - `true`: an asynchronous search. The API returns the response immediately.

  In both cases, the API returns `200 OK` with the search. The `queries` field is `null` until the search is complete:
  when its `status` field is `success`, `no_results`, or `error`. Then each query has the status and the results of its
  term. To get the search later, send `GET /v1.1/search/{searchId}` with the `id` field from the response.

  For details, see [Synchronous and asynchronous searches](../docs/searches.md) and
  [Perform a search](../docs/perform-a-search.md).
