operationId: deleteSearch
tags:
  - Search
summary: Delete a search
description: |
  Delete a search from your search history. The API returns `204 No Content` with no body.

  A deleted search stays in the `GET /v1.1/search` list and in the `GET /v1.1/search/{searchId}` response. The
  `deleted` field is `true`. The `id`, `created_at`, and `updated_at` fields keep their values, and the other fields
  are `null`.

  Deleting a search doesn't stop it. If the search is still running, its terms keep running, and AlsoAsked refunds
  the terms that fail or have no results. AlsoAsked sends no more webhook events for a deleted search.
security:
  - apiKey: []
parameters:
  - $ref: ../../components/parameters/search/searchId.yaml
responses:
  '204':
    $ref: ../../components/responses/search/DeleteSearch.yaml
  '401':
    $ref: ../../components/responses/errors/UnauthorizedError.yaml
  '402':
    $ref: ../../components/responses/errors/InsufficientPlanError.yaml
  '403':
    $ref: ../../components/responses/errors/ForbiddenError.yaml
  '404':
    $ref: ../../components/responses/errors/NotFoundError.yaml
  '422':
    $ref: ../../components/responses/errors/ValidationError.yaml
  '429':
    $ref: ../../components/responses/errors/RateLimitExceededError.yaml
  '500':
    $ref: ../../components/responses/errors/InternalServerError.yaml
