description: |
  A page of the searches in your search history, newest first. The `total` field has the number of searches in your
  search history. The searches in the `results` field don't have their results. To get the results of a search, use
  `GET /v1.1/search/{searchId}`.
headers:
  X-AlsoAsked-Credits:
    $ref: ../../headers/also-asked/X-AlsoAsked-Credits.yaml
  X-RateLimit-Remaining:
    $ref: ../../headers/rate-limiting/X-RateLimit-Remaining.yaml
  X-RateLimit-Limit:
    $ref: ../../headers/rate-limiting/X-RateLimit-Limit.yaml
content:
  application/json:
    schema:
      $ref: ../../schemas/search/PaginatedSearchRequests.yaml
    examples:
      default:
        summary: List searches response
        description: |
          The first page of a search history.
        value:
          $ref: ../../../examples/search/PaginatedSearchRequests.yaml
