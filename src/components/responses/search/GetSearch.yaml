description: |
  The search, with its status, the fields that you sent, and its results. The `queries` field is `null` until the
  search is complete. When the `status` field is `success`, `no_results`, or `error`, the `queries` field has one
  query for each unique term. Each query has the status and the results of its term.
headers:
  X-AlsoAsked-Credits:
    $ref: ../../headers/also-asked/X-AlsoAsked-Credits.yaml
  X-RateLimit-Limit:
    $ref: ../../headers/rate-limiting/X-RateLimit-Limit.yaml
  X-RateLimit-Remaining:
    $ref: ../../headers/rate-limiting/X-RateLimit-Remaining.yaml
  X-RateLimit-Reset:
    $ref: ../../headers/rate-limiting/X-RateLimit-Reset.yaml
content:
  application/json:
    schema:
      $ref: ../../schemas/search/SearchRequestResults.yaml
    examples:
      default:
        summary: Get search response
        description: |
          A search with the status `success` and its results.
        value:
          $ref: ../../../examples/search/SearchRequestResults.yaml
