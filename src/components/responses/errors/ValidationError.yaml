description: |
  A field or a parameter in the request isn't valid. The error type is `validation`. The `message` field of the body
  names the field or the parameter.
headers:
  X-AlsoAsked-Credits:
    $ref: ../../headers/also-asked/X-AlsoAsked-Credits.yaml
  X-RateLimit-Limit:
    $ref: ../../headers/rate-limiting/X-RateLimit-Limit.yaml
  X-RateLimit-Remaining:
    $ref: ../../headers/rate-limiting/X-RateLimit-Remaining.yaml
  X-RateLimit-Reset:
    $ref: ../../headers/rate-limiting/X-RateLimit-Reset.yaml
content:
  application/json:
    schema:
      $ref: ../../schemas/errors/Error.yaml
    examples:
      default:
        summary: Validation error
        description: |
          A `validation` error for the `count` query parameter with the value `101`, which is more than the maximum of
          `100`.
        value:
          $ref: ../../../examples/errors/ValidationError.yaml
