description: |
  You sent more requests than the rate limit allows. The error type is `rate_limit_exceeded`. Wait until the time
  in the `Retry-After` header, then send the request again. To find your rate limit, read the `X-RateLimit-Limit`
  header, not the `message` field of the body.
headers:
  Retry-After:
    $ref: ../../headers/rate-limiting/Retry-After.yaml
  X-RateLimit-Remaining:
    $ref: ../../headers/rate-limiting/X-RateLimit-Remaining.yaml
  X-RateLimit-Limit:
    $ref: ../../headers/rate-limiting/X-RateLimit-Limit.yaml
  X-RateLimit-Reset:
    $ref: ../../headers/rate-limiting/X-RateLimit-Reset.yaml
content:
  application/json:
    schema:
      $ref: ../../schemas/errors/Error.yaml
    examples:
      default:
        summary: Rate limit exceeded error
        description: |
          A `rate_limit_exceeded` error. You sent more requests than the rate limit allows. The `message` field doesn't
          describe your rate limit.
        value:
          $ref: ../../../examples/errors/RateLimitExceededError.yaml
