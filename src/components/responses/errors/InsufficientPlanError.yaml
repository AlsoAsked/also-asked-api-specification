description: |
  The live API needs a Pro plan, and your account doesn't have a Pro plan. The error type is `insufficient_plan`.
  Change your plan to Pro, or use the sandbox API, which doesn't need a Pro plan.
headers:
  X-RateLimit-Remaining:
    $ref: ../../headers/rate-limiting/X-RateLimit-Remaining.yaml
  X-RateLimit-Limit:
    $ref: ../../headers/rate-limiting/X-RateLimit-Limit.yaml
content:
  application/json:
    schema:
      $ref: ../../schemas/errors/Error.yaml
    examples:
      default:
        summary: Insufficient plan error
        description: |
          An `insufficient_plan` error. The live API needs a Pro plan, and your account doesn't have a Pro plan.
        value:
          $ref: ../../../examples/errors/InsufficientPlanError.yaml
