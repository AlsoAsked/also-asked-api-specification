description: |
  AlsoAsked doesn't accept the API key in the `X-Api-Key` header. The `status` field of the body has the error type.
headers:
  X-RateLimit-Remaining:
    $ref: ../../headers/rate-limiting/X-RateLimit-Remaining.yaml
  X-RateLimit-Limit:
    $ref: ../../headers/rate-limiting/X-RateLimit-Limit.yaml
content:
  application/json:
    schema:
      $ref: ../../schemas/errors/ForbiddenError.yaml
    examples:
      InvalidApiKeyError:
        summary: Invalid API key error
        description: |
          An `invalid_api_key` error. The value of the `X-Api-Key` header isn't a valid API key, the API key no longer
          exists, or the API key is for the other API. A live API key works only on the live API, and a sandbox API
          key works only on the sandbox API.
        value:
          $ref: ../../../examples/errors/InvalidApiKeyError.yaml
      ApiAccessDisabledError:
        summary: API access turned off error
        description: |
          An `api_access_disabled` error. AlsoAsked turned off API access for your account. Contact AlsoAsked support.
        value:
          $ref: ../../../examples/errors/ApiAccessDisabledError.yaml
