description: |
  An error happened in AlsoAsked. The error type is `internal_server`. If the `POST /v1.1/search` endpoint returns
  this error, AlsoAsked refunds the credits of every term that isn't complete, so you can send the request again. If
  AlsoAsked already recorded the search, those terms get the status `error`. If the check of the rate limit itself
  fails, the response has no rate limit headers and no `X-AlsoAsked-Credits` header.
headers:
  X-AlsoAsked-Credits:
    $ref: ../../headers/also-asked/X-AlsoAsked-Credits.yaml
  X-RateLimit-Limit:
    $ref: ../../headers/rate-limiting/X-RateLimit-Limit.yaml
  X-RateLimit-Remaining:
    $ref: ../../headers/rate-limiting/X-RateLimit-Remaining.yaml
  X-RateLimit-Reset:
    $ref: ../../headers/rate-limiting/X-RateLimit-Reset.yaml
content:
  application/json:
    schema:
      $ref: ../../schemas/errors/Error.yaml
    examples:
      default:
        summary: Internal server error
        description: |
          An `internal_server` error. An error happened in AlsoAsked.
        value:
          $ref: ../../../examples/errors/InternalServerError.yaml
