description: |
  The live API needs a Pro plan and your account doesn't have one, or your account doesn't have enough credits for
  the search. The `status` field of the body has the error type: `insufficient_plan` or `insufficient_credits`.
headers:
  X-RateLimit-Remaining:
    $ref: ../../headers/rate-limiting/X-RateLimit-Remaining.yaml
  X-RateLimit-Limit:
    $ref: ../../headers/rate-limiting/X-RateLimit-Limit.yaml
content:
  application/json:
    schema:
      $ref: ../../schemas/errors/PaymentRequiredError.yaml
    examples:
      InsufficientPlanError:
        summary: Insufficient plan error
        description: |
          An `insufficient_plan` error. The live API needs a Pro plan, and your account doesn't have a Pro plan.
        value:
          $ref: ../../../examples/errors/InsufficientPlanError.yaml
      InsufficientCreditsError:
        summary: Insufficient credits error
        description: |
          An `insufficient_credits` error. Your account doesn't have enough credits for the search. AlsoAsked doesn't
          charge any credits for the search.
        value:
          $ref: ../../../examples/errors/InsufficientCreditsError.yaml
