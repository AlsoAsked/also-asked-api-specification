description: |
  The request doesn't have the `X-Api-Key` header. The error type is `missing_api_key`. Put your API key in the
  `X-Api-Key` header of every request.
headers:
  X-RateLimit-Remaining:
    $ref: ../../headers/rate-limiting/X-RateLimit-Remaining.yaml
  X-RateLimit-Limit:
    $ref: ../../headers/rate-limiting/X-RateLimit-Limit.yaml
content:
  application/json:
    schema:
      $ref: ../../schemas/errors/Error.yaml
    examples:
      default:
        summary: Missing API key error
        description: |
          A `missing_api_key` error. The request doesn't have the `X-Api-Key` header.
        value:
          $ref: ../../../examples/errors/MissingApiKeyError.yaml
