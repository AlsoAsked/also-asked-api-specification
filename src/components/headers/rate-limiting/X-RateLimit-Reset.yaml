description: |
  The current time plus the length of the rate limit window, in Unix time (seconds since 1970-01-01T00:00:00Z). A
  request that you send now stops counting at this time. To know when you can send again after a `429` response, use
  the `Retry-After` header.
schema:
  type: integer
  format: int64
  minimum: 0
example: 1672531200
