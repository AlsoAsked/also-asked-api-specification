title: Account
type: object
description: |
  The account that owns the API key in the request. The `GET /v1.1/account` endpoint returns the account object. On the
  sandbox API, the credit fields and the `plan_type` field show the sandbox credits and the `pro` plan.
properties:
  id:
    type: string
    pattern: ^[a-zA-Z0-9]{32}$
    description: |
      The ID of the account.
    example: 6G8QgoK9ar0E1pB7Rl0LN5mxljdAvBWb
  name:
    type: string
    description: |
      The name of the account.
    example: Mantis Toboggan
  email:
    type: string
    format: email
    description: |
      The email address of the account.
    example: mantis.toboggan@example.com
  plan_type:
    type: string
    description: |
      The plan of the account. In a successful response, the value of the `plan_type` field is always `pro`: the live
      API returns `402 Payment Required` to an account without a Pro plan, and on the sandbox API the value is always
      `pro`. For a team member, the value is the plan of the team owner.
    enum:
      $ref: ../../../enums/PlanType.yaml
    example: pro
  credits:
    type: integer
    format: int64
    minimum: 0
    description: |
      The total credits that remain in the account: the value of the `web_credits` field plus the value of the
      `api_credits` field. On the sandbox API, the value of the `credits` field is the sandbox credits.
    example: 110
  web_credits:
    type: integer
    format: int64
    minimum: 0
    description: |
      The plan credits that remain in the account: the credits that come with the plan. The field keeps its earlier name
      for backward compatibility. AlsoAsked uses plan credits before pay-as-you-go credits. On the sandbox API, the
      value of the `web_credits` field is the sandbox credits.
    example: 100
  api_credits:
    type: integer
    format: int64
    minimum: 0
    description: |
      The pay-as-you-go credits that remain in the account: the credits that you bought. The field keeps its earlier
      name for backward compatibility: pay-as-you-go credits once paid only for searches on the API, and now also pay
      for searches on the AlsoAsked website. Pay-as-you-go credits don't expire. On the sandbox API, the value of the
      `api_credits` field is `0`.
    example: 10
  credits_reset_at:
    type: string
    format: date-time
    description: |
      The date and time when the plan credits of the account renew next, in ISO 8601 format. On the sandbox API, the
      date and time when the sandbox credits reset next.
    example: '2023-02-01T00:00:00+00:00'
  registered_at:
    type: string
    format: date-time
    description: |
      The date and time of the registration of the account, in ISO 8601 format.
    example: '2023-01-01T00:00:00+00:00'
example:
  $ref: ../../../examples/account/Account.yaml
