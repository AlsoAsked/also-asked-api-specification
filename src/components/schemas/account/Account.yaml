title: Account
type: object
description: |
  The account that owns the API key in the request. The `GET /v1.1/account` endpoint returns the account object. On the
  sandbox API, the credit fields and the `plan_type` field show the sandbox credits and the `pro` plan.
properties:
  id:
    type: string
    pattern: ^[a-zA-Z0-9]{32}$
    description: |
      The ID of the account.
    example: 6G8QgoK9ar0E1pB7Rl0LN5mxljdAvBWb
  name:
    type: string
    description: |
      The name of the account.
    example: Mantis Toboggan
  email:
    type: string
    format: email
    description: |
      The email address of the account.
    example: mantis.toboggan@example.com
  plan_type:
    type: string
    description: |
      The plan of the account. On the sandbox API, the value of the `plan_type` field is always `pro`.
    enum:
      $ref: ../../../enums/PlanType.yaml
    example: pro
  credits:
    type: integer
    format: int64
    minimum: 0
    description: |
      The total credits that remain in the account: the value of the `web_credits` field plus the value of the
      `api_credits` field. On the sandbox API, the value of the `credits` field is the sandbox credits.
    example: 110
  web_credits:
    type: integer
    format: int64
    minimum: 0
    description: |
      The web credits that remain in the account. Web credits pay for searches on the AlsoAsked website and on the
      AlsoAsked API. On the sandbox API, the value of the `web_credits` field is the sandbox credits.
    example: 100
  api_credits:
    type: integer
    format: int64
    minimum: 0
    description: |
      The API credits that remain in the account. API credits pay for searches on the AlsoAsked API when no web credits
      remain. On the sandbox API, the value of the `api_credits` field is `0`.
    example: 10
  credits_reset_at:
    type: string
    format: date-time
    description: |
      The date and time when the web credits of the account renew, in ISO 8601 format. On the sandbox API, the date and
      time when the sandbox credits reset.
    example: '2023-02-01T00:00:00+00:00'
  registered_at:
    type: string
    format: date-time
    description: |
      The date and time of the registration of the account, in ISO 8601 format.
    example: '2023-01-01T00:00:00+00:00'
example:
  $ref: ../../../examples/account/Account.yaml
