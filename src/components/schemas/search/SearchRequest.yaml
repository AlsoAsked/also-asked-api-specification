title: Search
type: object
description: |
  A search in your search history, without its results. The `GET /v1.1/search` endpoint returns a list of searches. To
  get the results of a search, use the `GET /v1.1/search/{searchId}` endpoint.
properties:
  id:
    type: string
    pattern: ^[a-zA-Z0-9]{32}$
    description: |
      The ID of the search: 32 letters and digits. Use the ID in the `GET /v1.1/search/{searchId}` endpoint.
    example: 9J1VrsN0ku2E6xW8M5Xh3zylpfZgIcba
  terms:
    anyOf:
      - type: array
        items:
          type: string
      - type: 'null'
    description: |
      The terms of the search. The value of the `terms` field is `null` if the search is deleted.
    example:
      - When to plant out broad beans?
      - How to grow broad beans?
      - When to harvest broad beans?
  language:
    anyOf:
      - type: string
        enum:
          $ref: ../../../enums/Language.yaml
      - type: 'null'
    description: |
      The language code of the search, for example `en`. The value of the `language` field is `null` if the search is
      deleted.
    example: en
  region:
    anyOf:
      - type: string
        enum:
          $ref: ../../../enums/Region.yaml
      - type: 'null'
    description: |
      The region code of the search: a two-letter International Organization for Standardization (ISO) 3166-1 code, for
      example `gb`. The value of the `region` field is `null` if the search is deleted.
    example: us
  latitude:
    type: [number, 'null']
    format: double
    description: |
      The latitude of the search. The value of the `latitude` field is `null` if the search has no location, or if
      the search is deleted.
    example: 51.5072
  longitude:
    type: [number, 'null']
    format: double
    description: |
      The longitude of the search. The value of the `longitude` field is `null` if the search has no location, or if
      the search is deleted.
    example: 0.1276
  status:
    anyOf:
      - type: string
        enum:
          $ref: ../../../enums/SearchRequestStatus.yaml
      - type: 'null'
    description: |
      The status of the search. A search is complete when its status is `success`, `no_results`, or `error`. The value
      of the `status` field is `null` if the search is deleted.
    example: success
  deleted:
    type: boolean
    description: |
      `true` if the search is deleted, otherwise `false`.
    example: false
  depth:
    anyOf:
      - type: integer
        format: int32
        minimum: 1
        maximum: 3
      - type: 'null'
    description: |
      The depth of the search: `1`, `2`, or `3`. The value of the `depth` field is `null` if the search is deleted.
    example: 2
  cached:
    type: [boolean, 'null']
    description: |
      `true` if at least one term of the search used results that AlsoAsked stored for an earlier search, instead of
      new results from Google. On the sandbox API, the value is `false`. The value of the `cached` field is `null` if
      the search is deleted.
    example: true
  created_at:
    type: string
    format: date-time
    description: |
      The date and time when AlsoAsked created the search, in ISO 8601 format.
    example: '2023-01-01T00:00:00Z'
  updated_at:
    type: string
    format: date-time
    description: |
      The date and time when the search last changed, in ISO 8601 format.
    example: '2023-01-01T00:00:10Z'
  cached_at:
    anyOf:
      - type: string
        format: date-time
      - type: 'null'
    description: |
      The date and time when AlsoAsked stored the oldest of the earlier results that the search used, in ISO 8601
      format. The value is `null` if no term of the search used stored results, on the sandbox API, or if the search
      is deleted.
    example: '2022-12-31T00:00:00Z'
example:
  $ref: ../../../examples/search/SearchRequest.yaml
