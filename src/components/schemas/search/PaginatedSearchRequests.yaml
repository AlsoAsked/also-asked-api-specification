title: Page of searches
type: object
description: |
  One page of the searches in your search history, newest first. The `GET /v1.1/search` endpoint returns the page of
  searches.
properties:
  results:
    type: array
    description: |
      The searches on the page, newest first. Each search has a `terms` field and no `queries` field. To get the results
      of a search, use the `GET /v1.1/search/{searchId}` endpoint.
    items:
      $ref: ./SearchRequest.yaml
    example:
    - id: 8A6Wp1vHt3E4q0F7c9Xs5n8oZu2Bm1dL
      language: de
      region: de
      latitude: 51.5072
      longitude: 0.1276
      status: success
      deleted: false
      depth: 3
      cached: false
      created_at: '2023-01-15T18:45:00+00:00'
      updated_at: '2023-01-15T18:50:00+00:00'
      cached_at: null
      terms:
      - Wie kann man Energie sparen?
      - Was sind die besten Tipps zum Energiesparen?
      - Wie senke ich meinen Energieverbrauch?
    - id: 5S8YdxC3vq9M5zF1Vb4Xh3zylpfZgIba
      language: null
      region: null
      latitude: null
      longitude: null
      status: null
      deleted: true
      depth: null
      cached: null
      created_at: '2023-01-10T15:00:00+00:00'
      updated_at: '2023-01-10T15:05:00+00:00'
      cached_at: null
      terms: null
    - id: 7T1aKjx9Vb8YX2tksUeQwTPn6N0ku2E6
      language: en
      region: gb
      latitude: null
      longitude: null
      status: success
      deleted: false
      depth: 2
      cached: true
      created_at: '2023-01-05T10:30:00+00:00'
      updated_at: '2023-01-05T10:32:00+00:00'
      cached_at: '2023-01-04T03:48:00+00:00'
      terms:
      - What are the best pasta recipes?
    - id: 9J1VrsN0ku2E6xW8M5Xh3zylpfZgIcba
      language: en
      region: us
      latitude: 51.5072
      longitude: 0.1276
      status: success
      deleted: false
      depth: 3
      cached: false
      created_at: '2023-01-01T00:00:00+00:00'
      updated_at: '2023-01-01T00:00:10+00:00'
      cached_at: null
      terms:
      - When to plant out broad beans?
      - How to grow broad beans?
      - When to harvest broad beans?
  total:
    type: integer
    format: int64
    description: |
      The total number of searches in your search history.
    example: 32
  page:
    type: integer
    format: int64
    description: |
      The number of the page in the response.
    example: 1
example:
  $ref: ../../../examples/search/PaginatedSearchRequests.yaml
