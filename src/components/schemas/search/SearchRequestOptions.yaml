title: New search
type: object
description: |
  The request body of the `POST /v1.1/search` endpoint. Only the `terms` field is required.
properties:
  terms:
    type: array
    description: |
      The terms to search for: 1 to 1,000 terms. Each term must be unique. AlsoAsked removes spaces at the start and end
      of each term. If 2 terms are the same after that, AlsoAsked searches the term once and charges credits for the
      term once.
    items:
      type: string
      description: |
        A term: 1 to 4,127 characters. A term must contain text other than spaces and quotes.
      minLength: 1
      maxLength: 4127
    minItems: 1
    maxItems: 1000
    uniqueItems: true
    example:
      - When to plant out broad beans?
      - How to grow broad beans?
      - When to harvest broad beans?
  language:
    type: string
    description: |
      The language code of the search, for example `en`. The default is `en`.
    enum:
      $ref: ../../../enums/Language.yaml
    example: en
    default: en
  region:
    type: string
    description: |
      The region code of the search: a two-letter International Organization for Standardization (ISO) 3166-1 code, for
      example `gb`. The default is `us`.
    enum:
      $ref: ../../../enums/Region.yaml
    example: us
    default: us
  depth:
    type: integer
    format: int32
    description: |
      The number of levels of results to get: `1`, `2`, or `3`. The default is `2`. A depth of `1` gets only top-level
      results. The cost for each term depends on the depth: 1 credit for a depth of `1` or `2`, and 4 credits for a
      depth of `3`.
    example: 2
    default: 2
    minimum: 1
    maximum: 3
  fresh:
    type: boolean
    description: |
      Set the `fresh` field to `true` to get new results from Google instead of cached results. The default is `false`.
      On the live API, a term with cached results costs nothing when `fresh` is `false`. When `fresh` is `true`, every
      term costs credits.
    example: false
    default: false
  async:
    type: boolean
    description: |
      Sets when the API returns the response. The default is `false`. If the `async` field is `false`, the search is a
      synchronous search: the API returns the response when the search is complete, or after 90 seconds. If the search
      isn't complete after 90 seconds, the `queries` field in the response is `null`. If the `async` field is `true`,
      the search is an asynchronous search: the API returns the response immediately. To get the results later, use the
      `GET /v1.1/search/{searchId}` endpoint.
    example: false
    default: false
  notify_webhooks:
    type: boolean
    description: |
      Set the `notify_webhooks` field to `false` if you don't want webhook events for the search. The default is `true`.
      AlsoAsked sends webhook events for synchronous searches and for asynchronous searches. On the live API, AlsoAsked
      sends webhook events only if the account has a Pro plan.
    example: true
    default: true
  latitude:
    type: number
    format: double
    minimum: -90
    maximum: 90
    description: |
      The latitude of the location for the search, from -90 to 90. Send the `latitude` field and the `longitude` field
      together. If the request body has only one of the two fields, the API returns the status code
      `422 Unprocessable Content`. A value of `0` is a real coordinate. AlsoAsked rounds the value to 7 decimal places.
    example: 51.5072
  longitude:
    type: number
    format: double
    minimum: -180
    maximum: 180
    description: |
      The longitude of the location for the search, from -180 to 180. Send the `latitude` field and the `longitude`
      field together. If the request body has only one of the two fields, the API returns the status code
      `422 Unprocessable Content`. A value of `0` is a real coordinate. AlsoAsked rounds the value to 7 decimal places.
    example: 0.1276
required:
  - terms
example:
  $ref: ../../../examples/search/SearchRequestOptions.yaml
