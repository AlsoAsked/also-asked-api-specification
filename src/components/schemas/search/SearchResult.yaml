title: Result
type: object
description: |
  One question that Google shows for a term, with its answer. A result can have child results.
properties:
  question:
    type: string
    description: |
      The question that Google shows for the term.
    example: When to plant out broad beans?
  position:
    type: array
    description: |
      The place of the result in the results for the term: the path from the top-level results to the result. Each
      number starts at 1. For example, `[3]` is the third top-level result, and `[3, 1]` is the first child result of
      the third top-level result. The value of the `position` field is the same in the `tree` results format and the
      `flat` results format.
    items:
      type: integer
      format: int32
      minimum: 1
    example: [3, 1]
  answer_excerpt:
    type: string
    description: |
      An excerpt of the answer.
    example: |
      Broad beans can be planted out from mid-April to mid-May. If you are growing them in a greenhouse, you can
      plant them out from mid-March.
  answer_href:
    type: string
    description: |
      The URL of the page with the answer.
    example: https://www.gardenersworld.com/how-to/grow/broad-beans/when-to-plant-out-broad-beans/
  answer_page_title:
    type: string
    description: |
      The title of the page with the answer.
    example: When to plant out broad beans? | Broad beans | Grow | Gardeners' World Magazine
  ai_overview:
    type: boolean
    description: |
      `true` if the answer is an AI overview, otherwise `false`. Google generates an AI overview from more than one web
      page.
    example: true
  ai_overview_hrefs:
    type: array
    nullable: true
    description: |
      The URLs of the sources of the AI overview. The value of the `ai_overview_hrefs` field is `null` if the answer
      isn't an AI overview.
    items:
      type: string
    example:
    - https://www.gardenersworld.com/how-to/grow/broad-beans/when-to-plant-out-broad-beans/
    - https://www.gardenwiseinstitute.org/resources/beans/when-to-plant-fava-beans
    - https://www.urbanvegally.com/articles/beans/when-to-plant-borlotti-beans
    - https://www.greenthumbacademy.net/bean-care/when-to-plant-kidney-beans
    - https://www.plantprodigest.com/edibles/beans/when-to-plant-lima-beans
  ai_overview_page_titles:
    type: array
    nullable: true
    description: |
      The page titles of the sources of the AI overview. The value of the `ai_overview_page_titles` field is `null` if
      the answer isn't an AI overview.
    items:
      type: string
    example:
    - When to plant out broad beans? | Broad beans | Grow | Gardeners' World Magazine
    - When to plant out fava beans - Gardenwise Institute
    - When to plant out borlotti beans - UrbanVeg Ally
    - When to plant out kidney beans - GreenThumb Academy
    - When to plant out lima beans - PlantPro Digest
  results:
    type: array
    description: |
      The child results of the result. A result has the `results` field only in the default `tree` results format. In
      the `flat` results format, use the `position` field to find the parent result of a child result.
    items:
      $ref: ./SearchResult.yaml
    example:
    - question: When to plant out broad beans?
      position: [1]
      answer_excerpt: |
        Broad beans can be planted out from mid-April to mid-May. If you are growing them in a greenhouse, you can
        plant them out from mid-March.
      answer_href: https://www.gardenersworld.com/how-to/grow/broad-beans/when-to-plant-out-broad-beans/
      answer_page_title: When to plant out broad beans? | Broad beans | Grow | Gardeners' World Magazine
      ai_overview: true
      ai_overview_hrefs:
      - https://www.gardenersworld.com/how-to/grow/broad-beans/when-to-plant-out-broad-beans/
      - https://www.gardenwiseinstitute.org/resources/beans/when-to-plant-fava-beans
      - https://www.urbanvegally.com/articles/beans/when-to-plant-borlotti-beans
      - https://www.greenthumbacademy.net/bean-care/when-to-plant-kidney-beans
      - https://www.plantprodigest.com/edibles/beans/when-to-plant-lima-beans
      ai_overview_page_titles:
      - When to plant out broad beans? | Broad beans | Grow | Gardeners' World Magazine
      - When to plant out fava beans - Gardenwise Institute
      - When to plant out borlotti beans - UrbanVeg Ally
      - When to plant out kidney beans - GreenThumb Academy
      - When to plant out lima beans - PlantPro Digest
      results:
      - question: When can I transplant broad beans?
        position: [1, 1]
        answer_excerpt: |
          Broad beans prefer to be planted in the position where they are to grow, but can be planted in individual
          pots during the autumn and transplanted in to the ground in the spring.
        answer_href: |
          https://www.rhs.org.uk/education-learning/gardening-children-schools/family-activities/grow-it/grow/broad-beans
        answer_page_title: Grow broad beans with children / RHS Gardening
        ai_overview: true
        ai_overview_hrefs:
        - https://www.rhs.org.uk/education-learning/gardening-children-schools/family-activities/grow-it/grow/runner-beans
        - https://www.rhs.org.uk/education-learning/gardening-children-schools/family-activities/grow-it/grow/carrots
        - https://www.rhs.org.uk/education-learning/gardening-children-schools/family-activities/grow-it/grow/peas
        - https://www.rhs.org.uk/education-learning/gardening-children-schools/family-activities/grow-it/grow/courgettes
        - https://www.rhs.org.uk/education-learning/gardening-children-schools/family-activities/grow-it/grow/sunflower-seedling
        ai_overview_page_titles:
        - Grow runner beans with children / RHS Gardening
        - Sow and tend carrots with kids / RHS Gardening
        - Plant and cultivate peas with children / RHS Gardening
        - Harvest courgettes together with kids / RHS Gardening
        - Raise sunflower seedlings with children / RHS Gardening
        results:
        - question: Do you get a second crop of broad beans?
          position: [1, 1, 1]
          answer_excerpt: |
            Broad beans are a cool season crop, so they will not produce a second crop. However, you can plant
            broad beans in the spring and again in the fall.
          answer_href: https://www.gardeningknowhow.com/edible/vegetables/broad-bean/growing-broad-beans.htm
          answer_page_title: Growing Broad Beans - Gardening Know How
          ai_overview: false
          ai_overview_hrefs: null
          ai_overview_page_titles": null
          results: []
        - question: What not to plant with broad beans?
          position: [1, 1, 2]
          answer_excerpt: |
            Broad beans are a cool season crop, so they will not produce a second crop. However, you can plant
            broad beans in the spring and again in the fall.
          answer_href: https://www.gardeningknowhow.com/edible/vegetables/broad-bean/growing-broad-beans.htm
          answer_page_title: Growing Broad Beans - Gardening Know How
          ai_overview: false
          ai_overview_hrefs: null
          ai_overview_page_titles": null
          results: []
        - question: How to grow broad beans in a greenhouse?
          position: [1, 1, 3]
          answer_excerpt: |
            Broad beans are a cool season crop, so they will not produce a second crop. However, you can plant
            broad beans in the spring and again in the fall.
          answer_href: https://www.gardeningknowhow.com/edible/vegetables/broad-bean/growing-broad-beans.htm
          answer_page_title: Growing Broad Beans - Gardening Know How
          ai_overview: false
          ai_overview_hrefs: null
          ai_overview_page_titles": null
          results: []
      - question: Do broad beans need to be dried before planting?
        position: [1, 2]
        answer_excerpt: |
          Next to potatoes, broad beans are one of the easiest staples to grow. Dried broad beans, or fava beans, are
          simply beans left in the pod until they rattle. When you've had your fill of fresh, leave the rest on the
          plant to dry. If it's wet, haul the pods indoors, to shell and dry somewhere warm.
        answer_href: https://www.gardeningknowhow.com/edible/vegetables/broad-bean/drying-broad-beans.htm
        answer_page_title: Drying Broad Beans - Gardening Know How
        ai_overview: true
        ai_overview_hrefs:
        - https://www.gardeningknowhow.com/edible/vegetables/broad-bean/drying-broad-beans.htm
        - https://www.gardenwiseinstitute.org/resources/beans/drying-fava-beans
        - https://www.urbanvegally.com/articles/beans/drying-borlotti-beans
        - https://www.greenthumbacademy.net/bean-care/drying-kidney-beans
        - https://www.plantprodigest.com/edibles/beans/drying-lima-beans
        ai_overview_page_titles:
        - Drying runner beans - Gardening Know How
        - Drying fava beans - Gardenwise Institute
        - Drying borlotti beans - UrbanVeg Ally
        - Drying kidney beans - GreenThumb Academy
        - Drying lima beans - PlantPro Digest
        results: []
example:
  $ref: ../../../examples/search/SearchResult.yaml
