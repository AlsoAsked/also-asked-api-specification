title: Error
type: object
description: |
  The body of an error response. Every error response from the AlsoAsked API has the `status` field and the `message`
  field.
properties:
  status:
    type: string
    description: |
      The error type. Use the `status` field in your code to decide what to do.
    enum:
      $ref: ../../../enums/ErrorType.yaml
    example: internal_server
  message:
    type: string
    description: |
      A description of the error for people to read. The text of the `message` field can change, so don't use the
      `message` field in your code.
example:
  $ref: ../../../examples/errors/InternalServerError.yaml
