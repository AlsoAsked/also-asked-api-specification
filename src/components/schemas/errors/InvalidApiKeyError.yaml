title: Invalid API key error
type: object
description: |
  The error body for the `invalid_api_key` error type. The AlsoAsked API returns the `invalid_api_key` error type with
  the status code `403 Forbidden` when the value of the `X-Api-Key` header isn't a valid API key, the API key no longer
  exists, or the API key is for the other API. A live API key works only on the live API, and a sandbox API key works
  only on the sandbox API.
properties:
  status:
    type: string
    description: |
      The error type. Use the `status` field in your code to decide what to do.
    enum:
      $ref: ../../../enums/ErrorType.yaml
    example: invalid_api_key
    pattern: ^invalid_api_key$
  message:
    type: string
    description: |
      A description of the error for people to read. The text of the `message` field can change, so don't use the
      `message` field in your code.
    example: The API key provided is invalid.
example:
  $ref: ../../../examples/errors/InvalidApiKeyError.yaml
