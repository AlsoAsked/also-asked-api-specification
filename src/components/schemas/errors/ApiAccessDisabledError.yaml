title: "`api_access_disabled` error"
type: object
description: |
  The error body for the `api_access_disabled` error type. The AlsoAsked API returns the `api_access_disabled` error
  type with the status code `401 Unauthorized` when AlsoAsked turned off API access for your account. Contact AlsoAsked
  support at `help@alsoasked.com`.
properties:
  status:
    type: string
    description: |
      The error type. Use the `status` field in your code to decide what to do.
    enum:
      $ref: ../../../enums/ErrorType.yaml
    example: api_access_disabled
    pattern: ^api_access_disabled$
  message:
    type: string
    description: |
      A description of the error for people to read. The text of the `message` field can change, so don't use the
      `message` field in your code.
    example: |
      Your API access has been disabled. Please contact us through live chat or email support@alsoasked.com for
      more information.
example:
  $ref: ../../../examples/errors/ApiAccessDisabledError.yaml
