description: |
  The body of a `POST /v1.1/search` request. The body has the terms to search for and the options of the search,
  for example the language code, the region code, and the depth.
required: true
content:
  application/json:
    schema:
      $ref: ../../schemas/search/SearchRequestOptions.yaml
    examples:
      default:
        summary: Perform a search
        description: |
          A request body that performs a synchronous search with 3 terms and a depth of 2.
        value:
          $ref: ../../../examples/search/SearchRequestOptions.yaml
