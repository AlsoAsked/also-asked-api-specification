description: |
  The body of a webhook request. AlsoAsked sends webhook events when the status of a search changes. The body is
  the same as the `GET /v1.1/search/{searchId}` response for the search, at the time when AlsoAsked sends the webhook
  request. The `queries` field has the results of the search only when the `status` field is `success`.
required: true
content:
  application/json:
    schema:
      $ref: ../../schemas/search/SearchRequestResults.yaml
    examples:
      default:
        summary: Webhook request body
        description: |
          The body of a webhook request for a search with the status `success`.
        value:
          $ref: ../../../examples/search/SearchRequestResults.yaml
