description: |
  The body of a webhook request. AlsoAsked sends webhook events when the status of a search changes. The body has the
  `event_id` field, followed by the fields of the `GET /v1.1/search/{searchId}` response for the search at the time
  when AlsoAsked sends the webhook request. The `queries` field is `null` until the search is complete. Then each query
  in the `queries` field has its own `status` field, and has results when its status is `success`.
required: true
content:
  application/json:
    schema:
      $ref: ../../schemas/search/SearchStatusChangedEvent.yaml
    examples:
      default:
        summary: Webhook request body
        description: |
          The body of a webhook request for a search with the status `success`.
        value:
          $ref: ../../../examples/search/SearchStatusChangedEvent.yaml
