webhooks:
  searchStatusChanged:
    post:
      operationId: searchStatusChanged
      tags:
        - Webhooks
      summary: Search status changed
      description: |
        The request that AlsoAsked sends to your webhook endpoint when the status of a search changes. Your server receives
        this request. It isn't an endpoint of the AlsoAsked API.

        AlsoAsked sends a `POST` request with a JSON body to the URL of your webhook endpoint. The body has the ID of the
        webhook event in the `event_id` field, followed by the fields of the `GET /v1.1/search/{searchId}` response for the
        search, at the time when AlsoAsked sends the request. The headers contain the webhook event type, the environment,
        and a signature that you use to verify the request.

        For details, see [Webhooks](../docs/webhooks.md) and
        [Verify webhook signatures](../docs/verify-webhook-signatures.md).
      parameters:
        - $ref: '#/components/parameters/X-AlsoAsked-Credits'
        - $ref: '#/components/parameters/X-AlsoAsked-Api-Version'
        - $ref: '#/components/parameters/X-AlsoAsked-Signature'
        - $ref: '#/components/parameters/X-AlsoAsked-Timestamp'
        - $ref: '#/components/parameters/X-AlsoAsked-Webhook-Event'
        - $ref: '#/components/parameters/X-AlsoAsked-Environment'
      requestBody:
        $ref: '#/components/requestBodies/StatusChangedWebhook'
      responses:
        2XX:
          description: |
            Your webhook endpoint received the webhook event. AlsoAsked doesn't send the webhook event again.
        3XX:
          description: |
            AlsoAsked doesn't follow redirects, so AlsoAsked counts the attempt as failed and sends the webhook event again
            later, up to 10 attempts in total. Use the final URL of your webhook endpoint.
        4XX:
          description: |
            AlsoAsked counts the attempt as failed and sends the webhook event again later, up to 10 attempts in total.
        5XX:
          description: |
            AlsoAsked counts the attempt as failed and sends the webhook event again later, up to 10 attempts in total.
components:
  headers:
    X-AlsoAsked-Credits:
      description: |
        The number of credits that remain in your account. On the live API, the value is your web credits plus your API
        credits. On the sandbox API, the value is your sandbox credits.
      schema:
        type: integer
        format: int64
        minimum: 0
      example: 100
    X-RateLimit-Limit:
      description: |
        The maximum number of requests that you can send in the window of the rate limit.
      schema:
        type: integer
        format: int64
        minimum: 0
      example: 200
    X-RateLimit-Remaining:
      description: |
        The number of requests that you can still send now: the lower of the remaining requests for your API key and for
        your IP address.
      schema:
        type: integer
        format: int64
        minimum: 0
      example: 184
    X-RateLimit-Reset:
      description: |
        The current time plus the length of the rate limit window, in Unix time (seconds since 1970-01-01T00:00:00+00:00). A
        request that you send now stops counting at this time. To know when you can send again after a `429` response, use
        the `Retry-After` header.
      schema:
        type: integer
        format: int64
        minimum: 0
      example: 1672531200
    Retry-After:
      description: |
        The time when you can send requests again, as an HTTP date in the RFC 1123 format.
      schema:
        type: string
        format: rfc1123-date-time
      example: Thu, 11 May 2023 07:28:00 GMT
  schemas:
    Account:
      title: Account
      type: object
      description: |
        The account that owns the API key in the request. The `GET /v1.1/account` endpoint returns the account object. On the
        sandbox API, the credit fields and the `plan_type` field show the sandbox credits and the `pro` plan.
      properties:
        id:
          type: string
          pattern: ^[a-zA-Z0-9]{32}$
          description: |
            The ID of the account.
          example: 6G8QgoK9ar0E1pB7Rl0LN5mxljdAvBWb
        name:
          type: string
          description: |
            The name of the account.
          example: Mantis Toboggan
        email:
          type: string
          format: email
          description: |
            The email address of the account.
          example: mantis.toboggan@example.com
        plan_type:
          type: string
          description: |
            The plan of the account. In a successful response, the value of the `plan_type` field is always `pro`: the live
            API returns `402 Payment Required` to an account without a Pro plan, and on the sandbox API the value is always
            `pro`. For a team member, the value is the plan of the team owner.
          enum:
            - free
            - basic
            - lite
            - pro
          example: pro
        credits:
          type: integer
          format: int64
          minimum: 0
          description: |
            The total credits that remain in the account: the value of the `web_credits` field plus the value of the
            `api_credits` field. On the sandbox API, the value of the `credits` field is the sandbox credits.
          example: 110
        web_credits:
          type: integer
          format: int64
          minimum: 0
          description: |
            The web credits that remain in the account: the credits that come with the plan. AlsoAsked uses web credits
            before API credits. On the sandbox API, the value of the `web_credits` field is the sandbox credits.
          example: 100
        api_credits:
          type: integer
          format: int64
          minimum: 0
          description: |
            The API credits that remain in the account: the credits that you bought. API credits don't expire. On the sandbox
            API, the value of the `api_credits` field is `0`.
          example: 10
        credits_reset_at:
          type: string
          format: date-time
          description: |
            The date and time when the web credits of the account renew next, in ISO 8601 format. On the sandbox API, the date
            and time when the sandbox credits reset next.
          example: '2023-02-01T00:00:00+00:00'
        registered_at:
          type: string
          format: date-time
          description: |
            The date and time of the registration of the account, in ISO 8601 format.
          example: '2023-01-01T00:00:00+00:00'
      example:
        id: 6G8QgoK9ar0E1pB7Rl0LN5mxljdAvBWb
        name: Mantis Toboggan
        email: mantis.toboggan@example.com
        plan_type: pro
        credits: 110
        web_credits: 100
        api_credits: 10
        credits_reset_at: '2023-02-01T00:00:00+00:00'
        registered_at: '2023-01-01T00:00:00+00:00'
