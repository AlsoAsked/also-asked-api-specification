  /search:
    get:
      operationId: listSearches
      tags:
        - Search
      summary: List searches
      description: |
        List the searches in your search history, newest first. The `page` query parameter sets the page, and the `count`
        query parameter sets the number of searches on each page.

        Each search in the `results` field has a `terms` field, but no `queries` field. To get the results of a search, send
        `GET /v1.1/search/{searchId}`.
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/count'
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          $ref: '#/components/responses/ListSearches'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '402':
          $ref: '#/components/responses/InsufficientPlanError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitExceededError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: performSearch
      tags:
        - Search
      summary: Perform a search
      description: |
        Perform a search for 1 or more terms. AlsoAsked charges the credits for the search when it creates the search.

        The `async` field in the request body sets how the API returns the response:

        - `false` (default): a synchronous search. The API waits until the search is complete, for a maximum of 90 seconds,
          and then returns the response.
        - `true`: an asynchronous search. The API returns the response immediately.

        In both cases, the API returns `200 OK` with the search. The `queries` field contains the results only when the
        `status` field is `success`. Otherwise, the `queries` field is `null`. To get the search later, send
        `GET /v1.1/search/{searchId}` with the `id` field from the response.

        For details, see [Synchronous and asynchronous searches](../docs/searches.md) and
        [Perform a search](../docs/perform-a-search.md).
      security:
        - apiKey: []
      requestBody:
        $ref: '#/components/requestBodies/PerformSearch'
      responses:
        '200':
          $ref: '#/components/responses/PerformSearch'
        '400':
          $ref: '#/components/responses/InvalidBodyError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '402':
          $ref: '#/components/responses/PaymentRequiredError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitExceededError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /search/{searchId}:
    get:
      operationId: getSearch
      tags:
        - Search
      summary: Get a search
      description: |
        Get a search by its ID. The response includes the status and the results of the search.

        The `queries` field contains one query for each term only when the `status` field is `success`. Otherwise, the
        `queries` field is `null`.

        The `results_format` query parameter sets how the API returns the results: `tree` (default) puts child results inside
        their parent result, and `flat` returns all results in one list.

        You can get only searches in your search history. For a search that isn't in your search history, the API returns
        `404 Not Found`.
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/searchId'
        - $ref: '#/components/parameters/resultsFormat'
      responses:
        '200':
          $ref: '#/components/responses/GetSearch'
        '401':
