      allowEmptyValue: false
      schema:
        type: integer
        default: 1
        minimum: 1
      example: 1
    searchId:
      name: searchId
      in: path
      description: |
        The ID of the search. The ID is in the `id` field of the search.
      required: true
      schema:
        type: string
        pattern: ^[a-zA-Z0-9]{32}$
        minLength: 32
        maxLength: 32
      example: 4S7HdxC3vq9M5zF1Vb8YX2tksUeQwTPn
    resultsFormat:
      name: results_format
      in: query
      description: |
        The format of the results in the response. With the `tree` value, each result has its child results in its
        `results` field. With the `flat` value, the response has all results in one list, in depth-first order: the child
        results of each result come after the result. With the `flat` value, the results don't have the `results` field.
        In both formats, the `position` field of each result gives the path from the top-level results to the result.
      required: false
      allowEmptyValue: false
      schema:
        type: string
        enum:
          - tree
          - flat
        default: tree
      example: tree
    X-AlsoAsked-Credits:
      name: X-AlsoAsked-Credits
      in: header
      description: |
        The number of credits that remain in your account when AlsoAsked sends the webhook request. For a sandbox webhook
        endpoint, the value is your sandbox credits.
      required: true
      schema:
        type: integer
        format: int64
        minimum: 0
      example: 100
    X-AlsoAsked-Api-Version:
      name: X-AlsoAsked-Api-Version
      in: header
      description: |
        The version of the webhook request format, in the format `major.minor`. The current version is `1.0`. This isn't the
        version of the AlsoAsked API, such as `v1.1`.
      required: true
      schema:
        type: string
        pattern: ^[0-9]+\.[0-9]+$
        minLength: 3
        maxLength: 9
      example: '1.0'
    X-AlsoAsked-Signature:
      name: X-AlsoAsked-Signature
      in: header
      description: |
        The signature of the webhook request, as 96 hexadecimal characters. Use the signature to verify that AlsoAsked
        sent the webhook request. AlsoAsked makes the signature with the `HMAC-SHA384` algorithm:
        `hex(HMAC-SHA384(key, body + '.' + timestamp))`. In this formula, `key` is your webhook signing key, `body` is the
        raw request body exactly as you receive it, and `timestamp` is the value of the `X-AlsoAsked-Timestamp` header.
        Don't parse and serialize the request body again before you verify the signature, because the new JSON can differ
        from the raw request body.
      required: true
      schema:
        type: string
        pattern: ^[a-fA-F0-9]{96}$
        minLength: 96
        maxLength: 96
      example: edd3bf9297835c7b02a41e0f4f188a17e9f50c235cc322eddda3780dbd817c932e9c913d2600415a56679a9c4f0cb550
    X-AlsoAsked-Timestamp:
      name: X-AlsoAsked-Timestamp
      in: header
      description: |
        The time when AlsoAsked sent the webhook request, in Unix time (seconds since 1970-01-01T00:00:00+00:00). AlsoAsked
        sets a new timestamp for each attempt. To prevent [replay attacks](https://en.wikipedia.org/wiki/Replay_attack)
        against your webhook endpoint, reject a webhook request with a timestamp that's older than a few minutes.
      required: true
      schema:
        type: integer
        format: int64
        minimum: 0
      example: 1672531200
    X-AlsoAsked-Webhook-Event:
      name: X-AlsoAsked-Webhook-Event
      in: header
      description: |
        The type of the webhook event, for example `search_succeeded`.
      required: true
      schema:
        type: string
        enum:
          - search_created
          - search_started
          - search_succeeded
          - search_failed
      example: search_succeeded
    X-AlsoAsked-Environment:
      name: X-AlsoAsked-Environment
      in: header
      description: |
        The API that the webhook event comes from: `live` for the live API, or `sandbox` for the sandbox API.
      required: true
      schema:
        type: string
        enum:
          - live
          - sandbox
      example: live
