    InsufficientPlanError:
      title: Insufficient plan error
      type: object
      description: |
        The error body for the `insufficient_plan` error type. The AlsoAsked API returns the `insufficient_plan` error type
        with the status code `402 Payment Required` when your account doesn't have a Pro plan. The live API needs a Pro plan.
        The sandbox API doesn't need a Pro plan.
      properties:
        status:
          type: string
          description: |
            The error type. Use the `status` field in your code to decide what to do.
          enum:
            - internal_server
            - invalid_api_key
            - missing_api_key
            - rate_limit_exceeded
            - not_found
            - validation
            - insufficient_credits
            - invalid_body
            - insufficient_plan
            - api_access_disabled
          example: insufficient_plan
          pattern: ^insufficient_plan$
        message:
          type: string
          description: |
            A description of the error for people to read. The text of the `message` field can change, so don't use the
            `message` field in your code.
          example: You must upgrade your account to a Pro plan to access the live API.
      example:
        status: insufficient_plan
        message: You must upgrade your account to a Pro plan to access the live API.
    InsufficientCreditsError:
      title: Insufficient credits error
      type: object
      description: |
        The error body for the `insufficient_credits` error type. The AlsoAsked API returns the `insufficient_credits` error
        type with the status code `402 Payment Required` when your account doesn't have enough credits for the search.
        AlsoAsked doesn't charge credits for the search. Check the credits in your account, or perform the search with fewer
        terms or a lower depth.
      properties:
        status:
          type: string
          description: |
            The error type. Use the `status` field in your code to decide what to do.
          enum:
            - internal_server
            - invalid_api_key
            - missing_api_key
            - rate_limit_exceeded
            - not_found
            - validation
            - insufficient_credits
            - invalid_body
            - insufficient_plan
            - api_access_disabled
          example: insufficient_credits
          pattern: ^insufficient_credits$
        message:
          type: string
          description: |
            A description of the error for people to read. The text of the `message` field can change, so don't use the
            `message` field in your code.
          example: You don't have enough credits to perform this request.
      example:
        status: insufficient_credits
        message: You don't have enough credits to perform this request.
    PaymentRequiredError:
      title: Payment required error
      type: object
      description: |
        The error body of a `402 Payment Required` response. The error type is `insufficient_plan` or `insufficient_credits`.
      oneOf:
        - $ref: '#/components/schemas/InsufficientPlanError'
        - $ref: '#/components/schemas/InsufficientCreditsError'
      discriminator:
        propertyName: status
        mapping:
          insufficient_plan: '#/components/schemas/InsufficientPlanError'
          insufficient_credits: '#/components/schemas/InsufficientCreditsError'
    SearchStatusChangedEvent:
      title: Webhook event body
      description: |
        The body of a webhook request: the ID of the webhook event, followed by every field of the search, as the
        `GET /v1.1/search/{searchId}` endpoint returns it when AlsoAsked sends the request.
      allOf:
        - type: object
          required:
            - event_id
          properties:
            event_id:
              type: string
              pattern: ^[a-zA-Z0-9]{32}$
              description: |
                The ID of the webhook event. Every attempt to deliver the same webhook event has the same ID, and the ID is part
                of the signed body. If your webhook endpoint receives an ID that it already processed, it can ignore the
                request.
              example: 4Jk2mQ9xVb7NzR1cT8yHp3LdWs6FgE0a
        - $ref: '#/components/schemas/SearchRequestResults'
  responses:
    GetAccount:
      description: |
        The account that owns the API key.
      headers:
        X-AlsoAsked-Credits:
          $ref: '#/components/headers/X-AlsoAsked-Credits'
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Account'
          examples:
            default:
              summary: Get account response
              description: |
                An account with a Pro plan, 100 web credits, and 10 API credits.
              value:
                id: 6G8QgoK9ar0E1pB7Rl0LN5mxljdAvBWb
                name: Mantis Toboggan
                email: mantis.toboggan@example.com
                plan_type: pro
                credits: 110
                web_credits: 100
                api_credits: 10
                credits_reset_at: '2023-02-01T00:00:00+00:00'
                registered_at: '2023-01-01T00:00:00+00:00'
    UnauthorizedError:
      description: |
        AlsoAsked can't identify your account. The error type is `missing_api_key` when the request doesn't have the
        `X-Api-Key` header, or `api_access_disabled` when AlsoAsked turned off API access for your account.
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedError'
          examples:
            MissingApiKeyError:
              summary: Missing API key error
              description: |
                A `missing_api_key` error. The request doesn't have the `X-Api-Key` header. Put your API key in the
                `X-Api-Key` header of every request.
              value:
                status: missing_api_key
                message: No API key has been specified.
            ApiAccessDisabledError:
              summary: '`api_access_disabled` error'
              description: |
                An `api_access_disabled` error. AlsoAsked turned off API access for your account. Contact AlsoAsked support at
                `support@alsoasked.com`.
              value:
                status: api_access_disabled
                message: Your API access has been disabled. Please contact us through live chat or email support@alsoasked.com for more information.
    InsufficientPlanError:
      description: |
        The live API needs a Pro plan, and your account doesn't have a Pro plan. The error type is `insufficient_plan`.
        Change your plan to Pro, or use the sandbox API, which doesn't need a Pro plan.
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            default:
              summary: Insufficient plan error
              description: |
                An `insufficient_plan` error. The live API needs a Pro plan, and your account doesn't have a Pro plan.
              value:
                status: insufficient_plan
                message: You must upgrade your account to a Pro plan to access the live API.
    ForbiddenError:
      description: |
        AlsoAsked doesn't accept the API key in the `X-Api-Key` header. The error type is `invalid_api_key`.
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
