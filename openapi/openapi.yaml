openapi: 3.1.0
info:
  title: AlsoAsked API
  description: |-
    The AlsoAsked API gets the "People Also Ask" questions that Google shows for a term. You send a search with 1 or
    more terms, and the API returns the results for each term.

    With the AlsoAsked API, you can perform a search, get the status and the results of a search, list the searches in
    your search history, delete a search, and get your account details and credits. AlsoAsked can also send webhook
    events to your webhook endpoints when the status of a search changes.

    ## Live API and sandbox API

    The AlsoAsked API has two environments with the same endpoints:

    - **Live API** (`https://alsoaskedapi.com/v1.1`): gets real results from Google and uses the credits of your plan.
      To use the live API, your account needs a Pro plan. To compare plans, go to
      [AlsoAsked pricing](https://alsoasked.com/pricing).
    - **Sandbox API** (`https://sandbox.alsoaskedapi.com/v1.1`): returns test results and uses separate sandbox
      credits. Any account can use the sandbox API.

    Each environment has its own API keys. Send the API key in the `X-Api-Key` header of each request. For details,
    see [Authenticate requests](../docs/authentication.md).

    ## Guides

    - [AlsoAsked API overview](../docs/overview.md)
    - [Quickstart](../docs/quickstart.md)
    - [Synchronous and asynchronous searches](../docs/searches.md)
    - [Perform a search](../docs/perform-a-search.md)
    - [Webhooks](../docs/webhooks.md)
    - [Errors](../docs/errors.md)

    ## Get help with the AlsoAsked API

    If you have a question about the AlsoAsked API, email AlsoAsked support at
    [support@alsoasked.com](mailto:support@alsoasked.com).
