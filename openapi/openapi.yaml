        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: deleteSearch
      tags:
        - Search
      summary: Delete a search
      description: |
        Delete a search from your search history. The API returns `204 No Content` with no body.

        A deleted search stays in the `GET /v1.1/search` list and in the `GET /v1.1/search/{searchId}` response. The
        `deleted` field is `true`. The `id`, `created_at`, and `updated_at` fields keep their values, and the other fields
        are `null`.
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/searchId'
      responses:
        '204':
          $ref: '#/components/responses/DeleteSearch'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '402':
          $ref: '#/components/responses/InsufficientPlanError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitExceededError'
        '500':
